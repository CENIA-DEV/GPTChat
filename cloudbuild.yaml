steps:
  # Paso 1: Construcción de la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from=us-central1-docker.pkg.dev/teak-truck-377020/gptchat-repo/gptchat:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/teak-truck-377020/gptchat-repo/gptchat:latest'
      - '.'

  # Paso 2: Subida de la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/teak-truck-377020/gptchat-repo/gptchat:latest']

  # Paso 3: Despliegue del Controller en Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fastchat-controller'
      - '--image=us-central1-docker.pkg.dev/teak-truck-377020/gptchat-repo/gptchat:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars=FASTCHAT_CMD=python3 -m fastchat.serve.controller --host 0.0.0.0 --port 8080'
      - '--port=8080'
      - '--memory=512Mi'
      - '--min-instances=1'

  # Paso 4: Despliegue del Web UI en Cloud Run cargando env-chat-arena desde Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'fastchat-webui'
      - '--image=us-central1-docker.pkg.dev/teak-truck-377020/gptchat-repo/gptchat:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--set-env-vars=FASTCHAT_CMD=python3 -m fastchat.serve.gradio_web_server_cenia --register-api-endpoint-file register_gcp --controller-url https://fastchat-controller-908374066028.us-central1.run.app --port 8080'
      - '--set-secrets=GCP_PROJECT_ID=fastchat_GCP_PROJECT_ID:latest'
      - '--set-secrets=GOOGLE_CLOUD_PROJECT=fastchat_GOOGLE_CLOUD_PROJECT:latest'
      - '--set-secrets=GCP_LOCATION=fastchat_GCP_LOCATION:latest'
      - '--set-secrets=GCP_PROJECT_ID_ANTHROPIC=fastchat_GCP_PROJECT_ID_ANTHROPIC:latest'
      - '--set-secrets=GCP_LOCATION_ANTHROPIC=fastchat_GCP_LOCATION_ANTHROPIC:latest'
      - '--set-secrets=OPENAI_API_KEY=fastchat_OPENAI_API_KEY:latest'
      - '--set-secrets=BUCKET_NAME=fastchat_BUCKET_NAME:latest'
      - '--set-secrets=SECRET_ID=fastchat_SECRET_ID:latest'
      - '--set-secrets=GOOGLE_CLIENT_ID=fastchat_GOOGLE_CLIENT_ID:latest'
      - '--set-secrets=GOOGLE_CLIENT_SECRET=fastchat_GOOGLE_CLIENT_SECRET:latest'
      - '--set-secrets=SECRET_KEY=fastchat_SECRET_KEY:latest'
      - '--set-secrets=CONTROLLER_URL=fastchat_CONTROLLER_URL:latest'
images:
  - 'us-central1-docker.pkg.dev/teak-truck-377020/gptchat-repo/gptchat:latest'
  
options:
  logging: CLOUD_LOGGING_ONLY
